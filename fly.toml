# Configuracao do Fly.io - a plataforma que faz mais sentido pra este projeto:
# roda o Dockerfile como esta, processo de longa duracao (sem timeout de
# funcao), CPU dedicada de verdade e disco persistente pro volume /dados.
#
# Antes do primeiro deploy:
#   1. instale o flyctl:  https://fly.io/docs/flyctl/install/
#   2. fly launch --no-deploy         (ele cria o app e PERGUNTA antes de sobrescrever este arquivo - responda nao)
#   3. fly volumes create dados --size 40 --region gru
#   4. fly secrets set AUTH_SENHA=sua-senha-forte
#   5. fly deploy
#
# "gru" = Sao Paulo. Troque pra regiao mais perto de quem vai usar.

app = "cortador-automatico"          # troque pra um nome unico global
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NAO_ABRIR = "1"
  NUM_THREADS = "2"
  QUALIDADE_PADRAO = "alta"
  DADOS = "/dados"

[[mounts]]
  source = "dados"
  destination = "/dados"

[http_service]
  internal_port = 8080
  force_https = true
  # IMPORTANTE: a transcricao roda por minutos com a conexao aberta (SSE).
  # Se a maquina for parada no meio de um job, o usuario perde o progresso.
  # Desligar o auto-stop custa mais (fica ligado 24/7), mas evita isso.
  # Se preferir economizar e aceitar essa limitacao, mude os dois pra "true"
  # e "stop_machines".
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

# performance-1x = 1 vCPU dedicada / 2 GB - o minimo razoavel pra transcrever
# video em tempo aceitavel. Para vídeos longos ou faster, veja DEPLOY.md.
[[vm]]
  size = "performance-1x"
